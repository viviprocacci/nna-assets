<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NNA Asset Tags</title>
<meta name="robots" content="noindex, nofollow">
<meta name="build" content="5c5d34a0f5">
<meta name="theme-color" content="#F6F5F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NNA Assets">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Fonts are served from this site (fonts/), so the app looks the same offline. */
@font-face {font-family: 'Archivo';font-style: normal;font-weight: 400;font-stretch: 100%;font-display: swap;src: url(fonts/Archivo.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face {font-family: 'Archivo';font-style: normal;font-weight: 500;font-stretch: 100%;font-display: swap;src: url(fonts/Archivo.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face {font-family: 'Archivo';font-style: normal;font-weight: 600;font-stretch: 100%;font-display: swap;src: url(fonts/Archivo.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face {font-family: 'IBM Plex Mono';font-style: normal;font-weight: 400;font-display: swap;src: url(fonts/IBMPlexMono-400.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face {font-family: 'IBM Plex Mono';font-style: normal;font-weight: 500;font-display: swap;src: url(fonts/IBMPlexMono-500.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face {font-family: 'Newsreader';font-style: normal;font-weight: 500;font-display: swap;src: url(fonts/Newsreader.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
/* Layout: one narrow app column (phone-first), logo header, three tabs. Deliberately light-only to match the
   green-on-white Newbury North logo and the Company Dashboard. */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --sunk:#EDECE6; --line:#E3E2DC; --line-2:#D8E2DD;
  --ink:#263230; --ink-2:#5C6864; --ink-3:#7C8884;
  --pine:#06372C; --pine-2:#0A4A3A; --tint:#E6EFEA; --brand:#0B5A46; --warn:#8A5A12;
  --serif:"Newsreader",Georgia,serif; --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine-2);outline-offset:2px;border-radius:6px}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding-block:4px 28px;display:grid;gap:18px;align-content:start}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
header img{height:40px;width:auto;display:block}
.fb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;cursor:pointer}
.fb svg{width:16px;height:16px}

.top{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:18px;height:18px}
h1{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;margin:0;color:var(--pine);text-wrap:balance}
.sub{font-size:13px;color:var(--ink-3)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;height:46px}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;height:100%;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search .pre{font-family:var(--mono);color:var(--ink-3)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:grid}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s b{font-family:var(--mono);font-weight:400;color:var(--ink-2)}
.row .n{font-family:var(--serif);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.row .chev{width:16px;height:16px;color:var(--ink-3);flex:none}
.glyph{width:38px;height:38px;border-radius:10px;background:var(--tint);color:var(--brand);display:grid;place-items:center;flex:none}
.glyph svg{width:20px;height:20px}
.thumb{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:contain;padding:4px}
.card.asset{padding:0;gap:0;overflow:hidden}
.card.asset .stage{height:clamp(190px,56vw,250px);padding:22px 24px;background:radial-gradient(ellipse 70% 80% at 50% 58%,#FFFFFF 0%,#F2F6F3 72%,#EAF0EC 100%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.card.asset .stage img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(6,55,44,.14))}
.card.asset .body{padding:16px;display:grid;gap:14px;min-width:0}
.card.asset h1{overflow-wrap:anywhere}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px;color:var(--pine);font-weight:500;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.card .head{display:flex;gap:14px;align-items:flex-start}
.card .big{width:56px;height:56px;border-radius:12px;background:var(--tint);color:var(--brand);display:grid;place-items:center;flex:none}
.card .big svg{width:30px;height:30px}
.id{font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.chip.pine{background:var(--tint);color:var(--pine)}
.chip svg{width:13px;height:13px}
.btn{height:48px;border-radius:10px;border:0;background:var(--pine);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn:hover{background:var(--pine-2)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.alt{background:var(--surface);color:var(--pine);border:1px solid var(--line-2)}
.btn.alt:hover{background:var(--tint)}
.chip.o{background:#E7EEF6;color:#2F4A6B}
.chip.od{background:#F6E3E0;color:#A33A32}
.row .s .o{color:#2F4A6B;font-weight:500}
.row .s .od{color:#A33A32;font-weight:500}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.field input{height:46px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--ink);width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.kv{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kv h2{margin:0;padding:12px 14px 2px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.kv dl{margin:0;padding:0 14px 4px}
.kv .r{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv .r:first-child{border-top:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv dd small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px}
.kv .none{color:var(--ink-3);font-weight:400;font-style:italic}
.same{display:flex;align-items:center;gap:12px;background:var(--tint);color:var(--pine);border:0;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.same b{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1}
.same span{flex:1;font-size:13.5px}
.same svg{width:16px;height:16px}
.hist{list-style:none;margin:0;padding:2px 14px 10px}
.hist li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.hist small{display:block;color:var(--ink-3);font-size:12.5px}
.note{font-size:12.5px;color:var(--ink-3);margin:0}

nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
@media (min-width:520px){nav{margin:0;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
.tab{border:0;background:none;display:grid;justify-items:center;gap:3px;font-size:11.5px;color:var(--ink-3);padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--pine);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(20,28,26,.42);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:460px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;max-height:85%;display:flex;flex-direction:column}
.sheet .sh{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.sheet .sb{overflow-y:auto;padding:10px 18px;display:grid;gap:6px}
.sheet .sf{padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt .main{flex:1}
.opt .s{display:block;font-size:12px;color:var(--ink-3)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.opt[aria-checked="true"]{border-color:var(--pine-2);background:var(--tint)}
.opt[aria-checked="true"] .dot{border:6px solid var(--pine-2)}
.opt:disabled{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;height:38px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.viewfinder{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:18px;background:#0E1513;overflow:hidden;display:grid;place-items:center;color:#DDE7E2}
.vf-frame{position:relative;width:62%;aspect-ratio:1/1}
.vf-frame i{position:absolute;width:26%;height:26%;border-color:#7FD1B0;border-style:solid;border-width:0}
.vf-frame i:nth-child(1){top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:12px}
.vf-frame i:nth-child(2){top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:12px}
.vf-frame i:nth-child(3){bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:12px}
.vf-frame i:nth-child(4){bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:12px}
.vf-line{position:absolute;left:6%;right:6%;height:2px;background:#7FD1B0;box-shadow:0 0 12px #7FD1B0;top:50%;animation:sweep 2.4s ease-in-out infinite alternate}
@keyframes sweep{from{top:10%}to{top:90%}}
.vf-cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12.5px;opacity:.85}
.nfc{position:relative;width:46%;aspect-ratio:1/1;display:grid;place-items:center}
.nfc span{position:absolute;inset:0;border-radius:50%;border:2px solid #7FD1B0;opacity:0;animation:ring 2.4s ease-out infinite}
.nfc span:nth-child(2){animation-delay:.8s}.nfc span:nth-child(3){animation-delay:1.6s}
.nfc svg{width:44px;height:44px;color:#7FD1B0}
@keyframes ring{from{transform:scale(.35);opacity:.9}to{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion: reduce){.vf-line,.nfc span{animation:none}.nfc span:nth-child(1){opacity:.5;transform:scale(.8)}}
.h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:14px;max-width:calc(100% - 32px)}

/* Installable app additions: real camera, lock screen, feedback sheet, update bar. */
[hidden]{display:none!important}
input{font-size:16px}  /* 16px stops iPhone zooming into a field */
a.btn{text-decoration:none}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf-cap{text-shadow:0 1px 3px rgba(0,0,0,.7)}
.torch{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(14,21,19,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.torch svg{width:20px;height:20px}
.torch[aria-pressed="true"]{background:#7FD1B0;color:#0E1513}
.scanmsg{margin:0;text-align:center;font-size:14px;font-weight:500;color:var(--pine);display:grid;gap:10px;justify-items:center}
.scanmsg:empty{display:none}
.scanmsg .btn{width:auto;height:40px;padding:0 18px}
.lock{display:grid;gap:16px;padding-top:6vh}
.lock .err{color:#A33A32;font-weight:500;min-height:1.45em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;font-weight:500}
.updbar{display:flex;align-items:center;gap:12px}
.updbar button{border:0;background:#fff;color:var(--ink);border-radius:8px;height:34px;padding:0 12px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="app">
  <header>
    <img src="img/logo.webp" alt="Newbury North">
    <button class="fb" id="fbBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Feedback</button>
  </header>
  <main id="screen" tabindex="-1"></main>
  <nav aria-label="Main" hidden>
    <button class="tab" data-tab="home" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg>Locations</button>
    <button class="tab" data-tab="scan" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 16h3"/></svg>Scan</button>
    <button class="tab" data-tab="all" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>All assets</button>
  </nav>
  <div id="overlay"></div>
</div>

<script>

/* Scanning: one parser for the camera, NFC and links. 4-digit numbers are assets. 3-digit codes (NNA-001 to 010)

const HAS_NFC='NDEFReader' in window;
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

function notice(text,retry){
  const el=document.getElementById('scanMsg');
  if(!el||S.view!=='scan')return toast(text);
  el.textContent=text;
  if(retry){const b=document.createElement('button');b.className='btn';b.type='button';b.dataset.act='camretry';b.textContent='Try again';el.appendChild(b)}
}
function handleCode(raw,src){
  const t=String(raw==null?'':raw).trim(),now=Date.now();
  if(src==='scan'&&t===lastCode&&now-lastAt<2500)return;
  lastCode=t;lastAt=now;
  const m=t.match(/\bNNA-(\d{3,4})(?!\d)/i);
  if(!m)return notice("That code isn't an NNA asset tag"+(t?': '+(t.length>60?t.slice(0,60)+'…':t):'.'));
  if(m[1].length===3)return notice('NNA-'+m[1]+' is a test tag, not an asset.');
  const id='NNA-'+m[1];
  if(!byId(id))return notice('No asset is tagged '+id+' yet.');
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  go('asset',{id});
}
function loadScanner(){
  if(window.QrScanner)return Promise.resolve(window.QrScanner);
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/qr-scanner.umd.min.js';s.onload=()=>res(window.QrScanner);s.onerror=()=>rej(new Error('Scanner did not load'));document.head.appendChild(s)});
}
function stopScan(){
  scanGen++;

}
async function startScan(){
  const g=++scanGen,video=document.getElementById('scanVideo'),cap=document.getElementById('scanCap');
  if(!video)return;
  if(!window.isSecureContext||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){cap.textContent='Camera unavailable';return notice('The camera only works on a secure (https) page. Type the number below instead.')}
  let qs=null;
  try{
    const Q=await loadScanner();if(g!==scanGen)return;
    qs=QS=new Q(video,r=>handleCode(r.data,'scan'),{returnDetailedScanResult:true,preferredCamera:'environment',maxScansPerSecond:10,onDecodeError:()=>{}});
    await qs.start();
    if(g!==scanGen){try{qs.destroy()}catch(e){}return}
    cap.textContent='Point at the QR code on the tag';
    if(await qs.hasFlash()&&g===scanGen){const b=document.getElementById('torchBtn');if(b)b.hidden=false}
  }catch(e){
    if(g!==scanGen)return;
    if(qs){try{qs.destroy()}catch(x){}if(QS===qs)QS=null}
    let denied=/NotAllowed|Permission/i.test(String(e&&e.name||e));
    try{if(!denied&&navigator.permissions)denied=(await navigator.permissions.query({name:'camera'})).state==='denied'}catch(x){}
    if(g!==scanGen)return;
    cap.textContent=denied?'Camera access is off':"Camera didn't start";
    notice(denied?'Allow camera access for this site (on iPhone: Settings › Apps › Safari › Camera), then try again. Or type the number below.'
                 :"Couldn't open the camera. If you blocked it for this site, allow it, then try again. Or type the number below.",true);
  }
}
async function startNfc(btn){
  const g=scanGen,cap=document.getElementById('scanCap');
  try{
    const ac=new AbortController(),r=new NDEFReader();
    r.onreading=e=>{for(const rec of e.message.records){if(['url','absolute-url','text'].includes(rec.recordType))return handleCode(new TextDecoder(rec.encoding||'utf-8').decode(rec.data),'nfc')}notice('That tag has no NNA asset number on it.')};

    await r.scan({signal:ac.signal});
    if(g!==scanGen){ac.abort();return}
    nfcAbort=ac;btn.hidden=true;
    document.querySelector('.nfc').insertAdjacentHTML('afterbegin','<span></span><span></span><span></span>');
    cap.textContent='Hold the back of your phone against the tag';
  }catch(e){notice(e&&e.name==='NotAllowedError'?"NFC access is off for this site. Allow it in the browser's site settings.":"NFC didn't start on this phone. Use QR instead.")}

}
function vAsset(){

  if(t.dataset.mode){S.scanMode=t.dataset.mode;return render(false)}
  if(t.dataset.model)return go('all',{q:t.dataset.model});
  if(t.dataset.to){pick=t.dataset.to;overlay.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-checked',o===t));const b=document.getElementById('mvGo');b.disabled=false;b.textContent='Move to '+pick;return}
  if(t.id==='mvGo')return doMove();
  if(t.id==='coGo')return doOut();
  if(t.id==='torchBtn'){if(QS)QS.toggleFlash().then(()=>t.setAttribute('aria-pressed',String(!!(QS&&QS.isFlashOn())))).catch(()=>{});return}
  if(t.id==='fbBtn')return openAbout();
  const act=t.dataset.act;
  if(act==='camretry')return render(false);
  if(act==='nfcstart')return startNfc(t);
  if(act==='lock')return lockDevice();
  if(act==='back')return back();
  if(act==='move')return openMove();
  if(act==='checkout')return openOut();
  if(act==='checkin')return doIn();
  if(act==='outlist')return go('out');
  if(act==='more'){S.limit+=40;return render(false)}
});
overlay.addEventListener('click',e=>{if(e.target.classList.contains('scrim'))overlay.innerHTML=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.innerHTML=''});
document.addEventListener('input',e=>{
  if(e.target.id==='coWho'){const b=document.getElementById('coGo'),v=e.target.value.trim();b.disabled=!v;b.textContent=v?'Check out to '+v:'Enter a name';return}
  if(e.target.id==='homeSearch'){S.stack=[];S.view='all';S.q=e.target.value;render(true);const i=document.getElementById('allSearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  else if(e.target.id==='allSearch'){S.q=e.target.value;S.limit=40;const p=e.target.selectionStart;render(false);const i=document.getElementById('allSearch');i.focus();i.setSelectionRange(p,p)}
});
document.addEventListener('submit',e=>{if(e.target.id==='coForm'){e.preventDefault();return doOut()}if(e.target.id!=='typeForm')return;e.preventDefault();
  const id='NNA-'+document.getElementById('typeNum').value.replace(/\D/g,'').padStart(4,'0');const err=document.getElementById('typeErr');
  if(byId(id))go('asset',{id});else{err.hidden=false;err.textContent='No asset is tagged '+id+'. Tags run from '+DATA[0].id+' to '+DATA[DATA.length-1].id+'.'}});

/* Feedback sheet: the claude.ai feedback page (Vivian's Claude reviews it) with email as the fallback; both addresses live
   inside the encrypted data. The page link carries #NNA-#### for the asset on screen, or #scan / #find / #move for the screen. */
function openAbout(){
  const views={home:'Locations',scan:'Scan',all:'All assets',out:'Checked out',loc:S.loc};
  const where=S.view==='asset'&&S.id?S.id:(views[S.view]||'');
  const href=payload.feedback?'mailto:'+payload.feedback+'?subject='+encodeURIComponent('NNA Asset Tags feedback'+(where?' ('+where+')':'')):'';
  const area={scan:'scan',home:'find',all:'find',loc:'find',out:'move'}[S.view];
  const page=payload.feedbackPage?payload.feedbackPage+(S.view==='asset'&&S.id?'#'+S.id:area?'#'+area:''):'';
  overlay.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="abT">
   <div class="sh"><div class="sub">NNA Asset Tags</div><h1 id="abT" style="font-size:22px">Feedback</h1></div>
   <div class="sb" style="gap:14px;padding-block:14px">
     <p class="note" style="font-size:14px;color:var(--ink-2)">What needs to be improved${where?' on '+esc(where):''}? ${page?"Write it on the feedback page. Vivian's Claude reads every note and replies there.":'Send Vivian a note.'}</p>
     ${page?`<a class="btn" href="${esc(page)}" target="_blank" rel="noopener">${ic('note')}Open the feedback page</a>`:''}
     ${href?`<a class="btn${page?' alt':''}" href="${esc(href)}">${ic('mail')}${page?'Email Vivian instead':'Send feedback'}</a>`:''}
     ${page?`<p class="note" style="font-size:12.5px;color:var(--ink-3)">The feedback page needs a claude.ai sign-in that Vivian has added. No account? Use email.</p>`:''}
     <dl class="facts"><dt>Inventory as of</dt><dd>${payload.asOf?fmtD(payload.asOf):'Unknown'}</dd><dt>Assets</dt><dd>${DATA.length}</dd><dt>App version</dt><dd style="font-family:var(--mono);font-weight:400">${esc(BUILD)}</dd></dl>
   </div>
   <div class="sf"><p class="note">Locking removes the passcode from this phone. Moves and check-outs saved here stay.</p><button class="btn alt" data-act="lock" type="button">${ic('lock')}Lock this phone</button></div></div>`;
}
document.getElementById('fbBtn').hidden=false;

/* Links: ?tag=NNA-0041 (from 404.html or the service worker), #NNA-0041, or a path ending in /NNA-0041. */
function openFromLink(){
  const q=new URLSearchParams(location.search).get('tag')||'';
  let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  const p=(location.pathname.match(/NNA-\d{3,4}\/?$/i)||[''])[0];
  const raw=q||(/NNA-/i.test(h)?h:'')||p;
  if(location.search||location.hash||p)history.replaceState(null,'',location.pathname.replace(/NNA-\d{3,4}\/?$/i,''));
  if(raw)handleCode(raw,'link');
}
window.addEventListener('hashchange',()=>{let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}if(/NNA-/i.test(h)){history.replaceState(null,'',location.pathname);handleCode(h,'link')}});
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))window.__nna={handleCode,S,render,go};  // local testing only

render(true);
openFromLink();
}

/* ---------- Boot: unlock the data, then start the app ---------- */
const AAD=new TextEncoder().encode('nna-asset-tags/v1');
const KEY_TAG=ENC.salt+':'+ENC.iter;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normPass=s=>s.normalize('NFC').trim().split(/\s+/).join(' ').toLowerCase();  // must match the build script
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('nna-asset-tags',1);r.onupgradeneeded=()=>r.result.createObjectStore('keys');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kv(mode,k,v){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('keys',mode==='get'?'readonly':'readwrite'),st=tx.objectStore('keys');
  const r=mode==='get'?st.get(k):mode==='put'?st.put(v,k):st.delete(k);tx.oncomplete=()=>res(r.result);tx.onerror=()=>rej(tx.error)})}
async function deriveKey(pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(normPass(pass)),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(ENC.salt),iterations:ENC.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlockWith(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv),additionalData:AAD},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function lockDevice(){try{await kv('delete','key')}catch(e){}location.reload()}
function startApp(payload){document.querySelector('nav').hidden=false;app(payload)}
function showLock(msg){
  const screen=document.getElementById('screen');
  screen.innerHTML=`<form class="lock" id="lockForm" autocomplete="on">
    <div><h1>Asset tags</h1><div class="sub">Enter the passcode to open NNA's asset list on this device. You only need to do this once per device.</div></div>
    <input class="vh" type="text" name="username" autocomplete="username" value="NNA Asset Tags" tabindex="-1" aria-hidden="true" readonly>
    <div class="field"><label for="pass">Passcode</label><input id="pass" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
    <button class="btn" id="unlockBtn" type="submit">Unlock</button>
    <p class="note err" id="lockErr" role="alert">${msg||''}</p>
    <p class="note">Don't have the passcode? Ask your NNA admin.</p>
  </form>`;
  document.getElementById('pass').focus();
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='lockForm')return;e.preventDefault();
  const btn=document.getElementById('unlockBtn'),pass=document.getElementById('pass'),err=document.getElementById('lockErr');
  btn.disabled=true;btn.textContent='Unlocking…';err.textContent='';
  let key,P;
  try{key=await deriveKey(pass.value);P=await unlockWith(key)}
  catch(x){btn.disabled=false;btn.textContent='Unlock';err.textContent="That passcode didn't work. Check it and try again.";pass.select();return}
  try{await kv('put','key',{key,tag:KEY_TAG})}catch(x){}  // if this phone won't save it, it asks again next time
  startApp(P);
});
(async function boot(){
  if(!(window.crypto&&crypto.subtle)){document.getElementById('screen').innerHTML='<p class="note" style="padding-top:6vh;font-size:15px">This app only works on a secure (https) address.</p>';return}
  let changed=false,P=null;
  try{const saved=await kv('get','key');
    if(saved&&saved.tag===KEY_TAG){try{P=await unlockWith(saved.key)}catch(x){changed=true}}
    if(saved&&!P)await kv('delete','key');
  }catch(x){}
  if(P)return startApp(P);
  showLock(changed?'The passcode has changed. Enter the new one.':'');
})();

/* Offline + updates: the service worker keeps a copy of the app. When a new version arrives, offer a reload. */
if('serviceWorker' in navigator&&window.isSecureContext){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||document.querySelector('.updbar'))return;
    const el=document.createElement('div');el.className='toast updbar';el.setAttribute('role','status');
    el.innerHTML='<span>Updated inventory available</span><button type="button">Reload</button>';
    el.querySelector('button').onclick=()=>location.reload();document.body.appendChild(el);
  });
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
